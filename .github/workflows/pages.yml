# Publishes docs/ to GitHub Pages. Before each deploy it checks that the page's components
# link to the same repositories as the "OGCR Architecture" Glossary Item on OBP-API
# (scripts/check_source_list.py). The daily run catches Glossary changes without a push.
#
# Needs: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer run replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # A difference, or an OBP-API that cannot be reached, shows as a warning on the run.
      # It never stops the deploy: the script changes nothing.
      - name: Check the repositories against the Glossary
        continue-on-error: true
        run: python3 scripts/check_source_list.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
